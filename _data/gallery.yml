- filename: 36fdc410-abd9-461b-bd31-103cf005c03f_rw_1920.jpg
  caption: The Spiral Of Yhoundeh
  alt: Broken window with view outside
  category: Architecture
  featured: true
  critique: The chiaroscuro light falls upon these iron teeth like moonlight on a
    mausoleum, each numbered cog a silent sentinel of secrets long buried; shot from
    this low, oblique angle, the wheels recede into a void of absolute black, as though
    the machine itself were a threshold to some knowledge better left unknown. The
    composition offers no warmth, no human respite—only the cold geometry of encryption,
    gleaming with a faint and terrible purpose.
- filename: 9d8399b4-37f0-4f65-a3ce-422a9c8b9981_rw_1920.jpg
  caption: The Chariot Of Yhoundeh
  alt: Old machinery in abandoned factory
  category: Industrial
  featured: true
  critique: The rails converge toward that wan, distant portal as if compelled by
    some gravity older than the tunnel itself; the arched ribs and tangled cables
